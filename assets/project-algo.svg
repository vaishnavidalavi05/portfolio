<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="900" height="650">
  <defs>
    <linearGradient id="algoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8F6F4"/>
      <stop offset="100%" stop-color="#ECE5DE"/>
    </linearGradient>
    <filter id="algoShadow" x="-10%" y="-10%" width="125%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#1A1817" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="900" height="650" fill="url(#algoBg)"/>

  <!-- Minimal Decorative Grid Lines -->
  <line x1="60" y1="0" x2="60" y2="650" stroke="#E2DACF" stroke-width="1"/>
  <line x1="840" y1="0" x2="840" y2="650" stroke="#E2DACF" stroke-width="1"/>
  <line x1="0" y1="60" x2="900" y2="60" stroke="#E2DACF" stroke-width="1"/>
  
  <text x="90" y="42" font-family="'Public Sans', sans-serif" font-size="11" font-weight="700" letter-spacing="3" fill="#A89B8F">CASE STUDY / 02</text>
  <text x="810" y="42" text-anchor="end" font-family="'Public Sans', sans-serif" font-size="11" font-weight="600" letter-spacing="2" fill="#A89B8F">ACADEMIC ROADMAP &middot; PYTHON &amp; JAVA</text>

  <!-- Browser Window Mockup -->
  <g transform="translate(110, 100)" filter="url(#algoShadow)">
    <rect width="680" height="460" rx="8" fill="#FFFFFF" stroke="#E0D7CD" stroke-width="1"/>
    <path d="M0 0 H680 V44 H0 Z" fill="#F4EFE9" rx="8"/>
    <rect x="0" y="36" width="680" height="8" fill="#F4EFE9"/>
    
    <circle cx="24" cy="22" r="5" fill="#E08272"/>
    <circle cx="40" cy="22" r="5" fill="#E8B868"/>
    <circle cx="56" cy="22" r="5" fill="#78B88C"/>

    <rect x="180" y="12" width="320" height="20" rx="4" fill="#FFFFFF" stroke="#E2DAD1"/>
    <text x="340" y="26" text-anchor="middle" font-family="'Public Sans', sans-serif" font-size="10" fill="#998A7D">algo-visualizer.pim / dsa-lab</text>

    <!-- Visualizer Canvas -->
    <rect x="36" y="70" width="608" height="350" rx="4" fill="#1C1815"/>

    <!-- Terminal Code / Nodes Representation -->
    <g transform="translate(60, 95)">
      <text x="0" y="20" font-family="'Space Grotesk', monospace" font-size="13" fill="#C95A34">// Algorithm: Dijkstra &amp; Binary Tree Traversal</text>
      <text x="0" y="44" font-family="'Space Grotesk', monospace" font-size="12" fill="#EAD9C8">class Node { int value; Node left, right; }</text>
      <text x="0" y="68" font-family="'Space Grotesk', monospace" font-size="12" fill="#A8988B">void traverseInOrder(Node root) { ... }</text>

      <!-- Visual Graph Nodes in terminal window -->
      <line x1="280" y1="180" x2="200" y2="240" stroke="#756456" stroke-width="2"/>
      <line x1="280" y1="180" x2="360" y2="240" stroke="#756456" stroke-width="2"/>
      <line x1="200" y1="240" x2="150" y2="290" stroke="#756456" stroke-width="2"/>
      <line x1="200" y1="240" x2="240" y2="290" stroke="#756456" stroke-width="2"/>

      <circle cx="280" cy="180" r="18" fill="#C95A34"/>
      <text x="280" y="185" text-anchor="middle" font-family="'Space Grotesk', monospace" font-size="12" font-weight="700" fill="#FFFFFF">50</text>

      <circle cx="200" cy="240" r="16" fill="#3D342C" stroke="#C95A34" stroke-width="1.5"/>
      <text x="200" y="245" text-anchor="middle" font-family="'Space Grotesk', monospace" font-size="11" font-weight="700" fill="#FFFFFF">30</text>

      <circle cx="360" cy="240" r="16" fill="#3D342C" stroke="#756456" stroke-width="1.5"/>
      <text x="360" y="245" text-anchor="middle" font-family="'Space Grotesk', monospace" font-size="11" font-weight="700" fill="#FFFFFF">70</text>

      <circle cx="150" cy="290" r="14" fill="#2E2620"/>
      <text x="150" y="294" text-anchor="middle" font-family="'Space Grotesk', monospace" font-size="10" fill="#D6C8BA">20</text>

      <circle cx="240" cy="290" r="14" fill="#2E2620"/>
      <text x="240" y="294" text-anchor="middle" font-family="'Space Grotesk', monospace" font-size="10" fill="#D6C8BA">40</text>
    </g>
  </g>
</svg>